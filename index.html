<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praise Adeoti — Portfolio</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme-portfolio");
          if (s) document.documentElement.setAttribute("data-theme", s);
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
            document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&family=Crimson+Pro:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <div id="cursor" class="cursor" aria-hidden="true">
      <div class="cursor-dot"></div>
      <div class="cursor-ring"></div>
    </div>
    <div class="theme-toggle">
      <span>Theme</span>
      <div
        class="toggle-track"
        id="theme-toggle-btn"
        role="button"
        aria-label="Toggle dark mode"
      >
        <div class="toggle-thumb"></div>
      </div>
    </div>

    <div class="container" id="content"></div>

    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
